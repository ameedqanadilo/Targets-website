<!doctype html>
<html dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Alex;src:url(fonts/fontsource-alexandria-5.3.0/files/alexandria-arabic-800-normal.woff2);font-weight:800;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:Alex;src:url(fonts/fontsource-alexandria-5.3.0/files/alexandria-arabic-900-normal.woff2);font-weight:900;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:Alex;src:url(fonts/fontsource-alexandria-5.3.0/files/alexandria-arabic-700-normal.woff2);font-weight:700;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:Alex;src:url(fonts/fontsource-alexandria-5.3.0/files/alexandria-arabic-400-normal.woff2);font-weight:400;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:Nun;src:url(fonts/fontsource-nunito-sans-5.3.0/files/nunito-sans-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:Nun;src:url(fonts/fontsource-nunito-sans-5.3.0/files/nunito-sans-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Nun;src:url(fonts/fontsource-nunito-sans-5.3.0/files/nunito-sans-latin-700-normal.woff2);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#161616}
body{font-family:Nun,Alex,"Noto Color Emoji",sans-serif;color:#fff}
body.ltr{direction:ltr}
.scene{position:absolute;inset:0;opacity:0}
.bg-dark{background:radial-gradient(ellipse at 50% 25%,#2a1418 0%,#161616 60%)}
.bg-red{background:#FF4343}
.bg-light{background:#F4F4F4}
.badge{position:absolute;top:70px;left:60px;z-index:50;background:#fff;border-radius:60px;padding:16px 30px 16px 22px;display:flex;align-items:center;gap:12px;direction:ltr;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.badge img{width:44px;height:46px}.badge b{font:900 34px Nun;color:#161616;letter-spacing:1px}
.el{position:absolute;left:0;right:0;opacity:0;will-change:transform}
.title{font-weight:900;font-size:104px;line-height:1.22;text-align:center;padding:0 60px}
.title.m{font-size:88px}.title.s{font-size:74px}
.hl{display:inline-block;background:#FF4343;color:#fff;padding:0 26px;border-radius:18px;transform:rotate(-2deg)}
.hlw{display:inline-block;background:#fff;color:#FF4343;padding:0 26px;border-radius:18px;transform:rotate(-2deg)}
.note{font-weight:700;font-size:30px;opacity:.85;text-align:center}
.notif{margin:0 70px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.15);border-radius:36px;padding:26px 34px;display:flex;gap:26px;align-items:center;backdrop-filter:blur(6px)}
.notif i{width:84px;height:84px;border-radius:22px;background:#FF4343;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:46px}
.notif .t{font:700 30px Nun,Alex;opacity:.7}.notif .m{font:800 46px Nun,Alex}
.phone{position:absolute;left:50%;width:780px;margin-left:-390px;background:#111;border-radius:70px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.phone .scr{background:#ECE5DD;border-radius:52px;overflow:hidden;height:100%;display:flex;flex-direction:column}
.phone .hd{background:#1F2C34;padding:34px 34px 26px;display:flex;align-items:center;gap:20px}
.phone .av{width:76px;height:76px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.phone .av img{width:46px}
.phone .nm{font:800 38px Nun,Alex;color:#fff}.phone .st{font:700 26px Nun,Alex;color:#7fd99a}
.chat{flex:1;padding:28px 26px;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.b{max-width:80%;padding:20px 26px 14px;border-radius:30px;font:700 40px/1.45 Nun,Alex;color:#111;opacity:0;transform-origin:top;position:relative;box-shadow:0 2px 3px rgba(0,0,0,.08)}
.b small{display:block;font:700 22px Nun;color:#888;text-align:left;margin-top:4px}
.b .tag{display:block;font:800 24px Nun,Alex;color:#0a8f4a;margin-bottom:4px}
.b.in{align-self:flex-start;background:#fff;border-top-right-radius:8px}
.b.out{align-self:flex-end;background:#D9FDD3;border-top-left-radius:8px}
body.ltr .b.in{align-self:flex-start}
.b.no{background:#ffe1e1}
.typing{align-self:flex-end;background:#D9FDD3;border-radius:30px;padding:22px 30px;opacity:0;display:flex;gap:10px}
.typing span{width:16px;height:16px;border-radius:50%;background:#5a8;display:block}
.cta{margin:0 auto;width:880px;background:#25D366;border-radius:90px;padding:34px 30px;display:flex;align-items:center;justify-content:center;gap:22px;font:900 54px Nun,Alex;color:#fff;box-shadow:0 0 0 14px rgba(37,211,102,.22)}
.cta i{width:70px;height:70px;border-radius:50%;background:#fff;color:#25D366;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:40px}
.pill{display:inline-block;background:#FF4343;color:#fff;font:900 50px Nun,Alex;padding:14px 34px;border-radius:24px;transform:rotate(-3deg)}
.mini{position:absolute;left:70px;right:70px;background:#ECE5DD;border-radius:40px;overflow:hidden;opacity:0}
.mini .lbl{font:900 40px Nun,Alex;padding:20px 30px;color:#fff}
.mini .chat{padding:20px}
.mini .b{font-size:34px;max-width:86%}
.big{font:900 260px Nun,Alex;text-align:center;color:#FF4343;line-height:1}
.end{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:40px}
.end .lg{display:flex;align-items:center;gap:26px;direction:ltr}
.end img{width:170px}.end b{font:900 110px Nun;color:#161616;letter-spacing:2px}
.end p{font:800 48px Nun;color:#555;direction:ltr}
.clock{font:900 64px Nun;text-align:center;color:#c33}
</style></head><body>
<div class="badge" id="badge"><img src="icon.svg"><b>TARGETS</b></div>
<div id="root"></div>
<script>
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const back=x=>{x=Math.max(0,Math.min(1,x));const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let SCENES=[];
function build(cfg){
  if(cfg.ltr){document.body.classList.add('ltr');document.documentElement.dir='ltr'}
  const root=document.getElementById('root');
  cfg.scenes.forEach(sc=>{
    const d=document.createElement('div');d.className='scene '+(sc.bg||'bg-dark');d.innerHTML=sc.html;root.appendChild(d);
    const items=[...d.querySelectorAll('[data-t]')].map(e=>({e,t:+e.dataset.t,k:e.dataset.k||'up',o:e.dataset.o?+e.dataset.o:null}));
    SCENES.push({d,s:sc.s,e:sc.e,items,light:sc.bg==='bg-light'});
  });
}
function render(t){
  let showBadge=true;
  SCENES.forEach(sc=>{
    const fin=ease((t-sc.s)/0.25), fout=1-ease((t-(sc.e-0.2))/0.2);
    const op=t<sc.s||t>sc.e?0:Math.min(fin,fout);
    sc.d.style.opacity=op;sc.d.style.display=op>0?'block':'none';
    if(op>0.5&&sc.light)showBadge=false;
    const lt=t-sc.s;
    sc.items.forEach(({e,t:ti,k,o})=>{
      const p=(lt-ti)/0.4;
      let v=ease(p);
      if(o!==null&&lt>o){v=1-ease((lt-o)/0.25)}
      e.style.opacity=v;
      if(k==='up')e.style.transform=`translateY(${(1-ease(p))*60}px)`;
      else if(k==='pop')e.style.transform=`scale(${0.6+0.4*back(p)})`;
      else if(k==='side')e.style.transform=`translateX(${(1-ease(p))*-200}px)`;
      else if(k==='zoom')e.style.transform=`scale(${1.4-0.4*ease(p)})`;
      else if(k==='pulse')e.style.transform=`scale(${(0.6+0.4*back(p))*(1+0.04*Math.sin(lt*6))})`;
      if(e.classList.contains('typing')){e.querySelectorAll('span').forEach((s,i)=>s.style.transform=`translateY(${Math.sin(lt*10-i)*6}px)`)}
      if(e.dataset.clock){const a=+e.dataset.clock.split('-')[0],b=+e.dataset.clock.split('-')[1];const q=Math.max(0,Math.min(1,(lt-ti)/1.6));const m=Math.round(a+(b-a)*q);e.textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
    });
  });
  document.getElementById('badge').style.opacity=showBadge?1:0;
}
</script></body></html>
